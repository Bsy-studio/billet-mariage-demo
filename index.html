<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brunelle & Steve</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #f8f3ed;
            color: #333;
            text-align: center;
        }

        .accueil {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .photo {
            width: 90%;
            max-width: 500px;
            height: 600px;
            object-fit: cover;
            border-radius: 250px 250px 25px 25px;
            border: 6px solid white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .bienvenue {
            margin-top: 30px;
            font-size: 20px;
            color: #006b5b;
        }

        h1 {
            font-size: 44px;
            margin: 10px 0;
            color: #006b5b;
        }

        .date {
            font-size: 21px;
            color: #b65f3c;
            margin: 15px 0 30px;
        }

        .bouton {
            background: #006b5b;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            border: none;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }

        .fenetre {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .formulaire {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .formulaire h2 {
            color: #006b5b;
            margin-top: 0;
        }

        .formulaire input,
        .formulaire select,
        .formulaire textarea {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: Arial, sans-serif;
        }

        .formulaire textarea {
            height: 100px;
            resize: none;
        }

        .fermer {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #555;
        }

        .envoyer {
            background: #b65f3c;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="accueil">

        <img src="mariage.jpeg"
             alt="Brunelle et Steve"
             class="photo">

        <div class="bienvenue">
            Bienvenue à notre mariage
        </div>

        <h1>Brunelle & Steve</h1>

        <div class="date">
            22 août 2026
        </div>

        <button class="bouton" onclick="ouvrirRSVP()">
            Confirmer ma présence
        </button>

    </div>


    <div id="rsvp" class="fenetre">

        <div class="formulaire">

            <span class="fermer" onclick="fermerRSVP()">×</span>

            <h2>Confirmer ma présence</h2>

            <input
                type="text"
                placeholder="Nom et prénom">

            <select>
                <option>Je serai présent(e)</option>
                <option>Je ne pourrai pas venir</option>
            </select>

            <input
                type="text"
                placeholder="Nom de mon accompagnateur">

            <textarea
                placeholder="Un petit message pour les mariés"></textarea>

            <button class="envoyer">
                Envoyer ma réponse
            </button>

        </div>

    </div>


    <script>

        function ouvrirRSVP() {
            document.getElementById("rsvp").style.display = "flex";
        }

        function fermerRSVP() {
            document.getElementById("rsvp").style.display = "none";
        }

    </script>

</body>

</html>
