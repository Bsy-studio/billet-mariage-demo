<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brunelle & Steve</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f3ed;
            color: #333;
            text-align: center;
        }

        .billet {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h2 {
            font-weight: normal;
            margin-bottom: 30px;
        }

        .date {
            font-size: 22px;
            margin-bottom: 30px;
        }

        .bouton {
            background: #006b5b;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>

<body>

    <div class="billet">

        <h2>Bienvenue à notre mariage</h2>

        <h1>Brunelle & Steve</h1>

        <div class="date">
            22 août 2026
        </div>

        <a href="#" class="bouton">
            Confirmer ma présence
        </a>

    </div>

</body>
</html>
