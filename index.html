<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brunelle & Steve</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #f8f3ed;
            color: #333;
            text-align: center;
        }

        .accueil {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            box-sizing: border-box;
        }

        .photo {
            width: 90%;
            max-width: 500px;
            height: 600px;
            object-fit: cover;
            border-radius: 140px 140px 20px 20px;
            border: 6px solid white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .bienvenue {
            margin-top: 30px;
            font-size: 20px;
            color: #006b5b;
        }

        h1 {
            font-size: 44px;
            margin: 10px 0;
            color: #006b5b;
        }

        .date {
            font-size: 21px;
            color: #b65f3c;
            margin: 15px 0 30px;
        }

        .bouton {
            background: #006b5b;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <div class="accueil">

        <img src="mariage.jpeg" alt="Brunelle et Steve" class="photo">

        <div class="bienvenue">
            Bienvenue à notre mariage
        </div>

        <h1>Brunelle & Steve</h1>

        <div class="date">
            22 août 2026
        </div>

        <a href="#" class="bouton">
            Confirmer ma présence
        </a>

    </div>

</body>
</html>
